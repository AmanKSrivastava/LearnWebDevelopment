<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML - Cards</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="cards"></div>
    <div class="card-form">
      <form id="createCardForm" class="hideForm">
        <div class="form-input">
          <label for="name">Name:</label>
          <input type="text" name="name" id="name" required />
        </div>
        <div class="form-input">
          <label for="desc">Description:</label>
          <input type="text" name="desc" id="desc" required />
        </div>
        <div class="form-input">
          <label for="imageUrl">Image Url:</label>
          <input type="url" name="imageUrl" id="imageUrl" />
        </div>
        <button class="create-form" type="submit">Create</button>
        <button class="cancel-edit cancel-edit-hide" type="button">
          Cancel
        </button>
      </form>
    </div>
    <div class="button">
      <button class="add-card" type="button">Add new card</button>
      <button class="delete-card" type="reset">Delete card</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
