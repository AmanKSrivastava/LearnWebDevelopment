<!-- Todo Using HTML, CSS & JS -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML - Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="todo-app">
      <div class="todo-card">
        <h1 class="todo-title">To Do List</h1>
        <div class="todo-input">
          <input type="text" name="task" id="add-task-text" />
          <input type="button" value="Add" id="add-task-button" />
        </div>
        <h2 class="todo-list-title">Task List</h2>
        <ul class="todo-list"></ul>
        <hr />
        <div class="todo-status-count">
          <p>Total : <span id="total-count">0</span></p>
          <p>Completed : <span id="completed-count">0</span></p>
          <p>Pending : <span id="uncompleted-count">0</span></p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
